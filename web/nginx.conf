server {
    listen 80;
    root /usr/share/nginx/html;

    # Scans can be up to 10 MB (enforced by the API)
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # The service worker must never be cached, or PWA updates get stuck
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # index.html names the current build's files, so browsers must re-check it or they keep running an old build.
    # (Every app route falls back to it below; the hashed files in /assets can stay cached.)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
